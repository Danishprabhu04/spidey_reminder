# Publishes the app hub (hub/) to GitHub Pages whenever it changes.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions".  Until then this workflow just skips (stays green).
# The hub then lives at https://danishprabhu04.github.io/spidey_reminder/
name: publish-hub

on:
  push:
    branches: [main]
    paths: ["hub/**", ".github/workflows/hub.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off – enable it (Settings → Pages → Source: GitHub Actions) to publish the hub."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub
      - id: deployment
        uses: actions/deploy-pages@v4
