[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spidey-sense"
dynamic = ["version"]
description = "Spidey Sense – a friendly desktop companion that hangs on your screen and keeps your to-do list"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6.0",
    "dbus-python>=1.3.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-qt>=4.0.0"]
build = ["pyinstaller>=6.0", "pillow>=10.0"]

[project.scripts]
hanging-reminder = "hanging_reminder.app:main"
spidey-sense = "hanging_reminder.app:main"

[tool.setuptools.dynamic]
version = {attr = "hanging_reminder.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hanging_reminder = ["dashboard/static/*"]
