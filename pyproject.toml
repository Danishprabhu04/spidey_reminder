[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-man-hanging-reminder"
version = "0.1.0"
description = "Spider-Man Hanging Reminder – a desktop companion for Ubuntu 24.04"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "dbus-python>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]